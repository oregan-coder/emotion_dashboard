<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史回测 - A股情绪驾驶舱 V3.5.6</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .backtest-wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .bt-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .bt-nav a { color: var(--gold); text-decoration: none; font-size: 14px; }
    .bt-nav a:hover { text-decoration: underline; }
    .bt-nav h1 { font-size: 20px; color: var(--text); margin: 0; }
    .bt-warning {
      background: rgba(240, 185, 11, 0.1);
      border: 1px solid rgba(240, 185, 11, 0.3);
      color: var(--gold);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .bt-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .bt-stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .bt-stat .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; }
    .bt-stat .value { font-size: 24px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
    .bt-stat .value.up { color: var(--up); }
    .bt-stat .value.down { color: var(--down); }
    .bt-stat .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .bt-section { margin-bottom: 16px; }
    .bt-section h2 { font-size: 15px; color: var(--gold); margin: 0 0 10px; letter-spacing: 1px; }
    .bt-chart { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .bt-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .bt-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .bt-table th { background: rgba(240, 185, 11, 0.1); color: var(--gold); padding: 8px 10px; text-align: center; font-weight: 600; border-bottom: 1px solid var(--border); }
    .bt-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text); }
    .bt-table tr:hover { background: rgba(255,255,255,0.03); }
    .bt-zone-bar { height: 8px; border-radius: 4px; margin-top: 4px; }
    .bt-interpret { font-size: 12px; color: var(--muted); padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 6px; margin-top: 8px; line-height: 1.6; }
    @media (max-width: 900px) { .bt-grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="backtest-wrap">
    <div class="bt-nav">
      <h1>历史回测分析</h1>
    </div>
    <div id="btWarning" class="bt-warning" style="display:none;"></div>

    <!-- 概览统计 -->
    <div class="bt-section">
      <h2>▎数据概览</h2>
      <div class="bt-overview" id="btOverview"></div>
    </div>

    <!-- 历史走势 -->
    <div class="bt-section">
      <h2>▎情绪分历史走势</h2>
      <div class="bt-chart"><div id="btTrendChart" style="width:100%;height:300px;"></div></div>
    </div>

    <!-- 情绪分区间回测（核心） -->
    <div class="bt-section">
      <h2>▎情绪分区间回测（核心）</h2>
      <div class="bt-grid2">
        <div class="bt-chart"><div id="btZoneChart" style="width:100%;height:320px;"></div></div>
        <div class="bt-chart">
          <table class="bt-table" id="btZoneTable">
            <thead>
              <tr><th>情绪区间</th><th>次数</th><th>占比</th><th>次日情绪变化</th><th>次日上涨概率</th></tr>
            </thead>
            <tbody></tbody>
          </table>
          <div class="bt-interpret">说明：由于暂无指数涨跌数据，用「次日情绪分上升概率」和「次日情绪分平均变化」作为赚钱效应代理指标。情绪分上升通常对应市场回暖、打板赚钱效应增强。</div>
        </div>
      </div>
    </div>

    <!-- 砸盘情绪回测 + 最高板回测 -->
    <div class="bt-section">
      <h2>▎砸盘情绪 & 最高板回测</h2>
      <div class="bt-grid2">
        <div class="bt-chart">
          <h3 style="font-size:13px;color:var(--gold);margin:0 0 8px;">砸盘分数区间次日表现</h3>
          <table class="bt-table" id="btSmashTable">
            <thead><tr><th>砸盘区间</th><th>次数</th><th>次日情绪变化</th><th>次日上涨概率</th></tr></thead>
            <tbody></tbody>
          </table>
          <div class="bt-interpret" id="btSmashCorr"></div>
        </div>
        <div class="bt-chart">
          <h3 style="font-size:13px;color:var(--gold);margin:0 0 8px;">最高板高度次日表现</h3>
          <table class="bt-table" id="btHighestTable">
            <thead><tr><th>最高板</th><th>次数</th><th>次日1进2晋级率</th><th>次日情绪变化</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/echarts.min.js"></script>
  <script src="/static/js/backtest.js"></script>

<button class="side-handle" id="sideHandle" title="展开/收起目录">▶</button>
<aside class="side-drawer" id="sideDrawer">
  <a href="/" class="side-link" title="决策舱首页" class="side-link ls5">决策舱首页</a>
  <a href="/backtest" class="side-link" title="历史回测分析" class="side-link ls4">历史回测</a>
  <a href="/validation" class="side-link" title="数据与验证只读页面" class="side-link ls5">数据与验证</a>
  <a href="/research/cycle-theme" class="side-link" title="情绪周期与主线观察研究页" class="side-link ls5">周期与主线</a>
  <a href="/research/theme-review" class="side-link" title="暂停计算，仅查看既有独立修订">题材复核存档</a>
</aside>
<script>
(function(){
  var d=document.getElementById('sideDrawer'),h=document.getElementById('sideHandle');
  function paint(){var o=d.classList.contains('open');h.classList.toggle('open',o);h.textContent=o?'◀':'▶';}
  function open(){d.classList.add('open');paint();}
  function close(){d.classList.remove('open');paint();}
  d.classList.add('open');paint();
  if(h){h.addEventListener('click',function(){d.classList.contains('open')?close():open();});}
  window.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
</body>
</html>
